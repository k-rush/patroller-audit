name: Monitor test
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ring-test
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_TEST_MONITORING == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: test-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check application and Cosmos readiness without writes
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: node scripts/smoke.mjs
      - name: Record operator-visible result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Test read-only monitor result: %s\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
