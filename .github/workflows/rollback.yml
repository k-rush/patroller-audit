name: Rollback ring
on:
  workflow_dispatch:
    inputs:
      ring:
        description: Ring to restore
        type: choice
        options: [test, staging, production]
        required: true
      revision:
        description: Retained known-good revision name from Azure or deployment artifacts
        type: string
        required: true
      reason:
        description: Operator reason for bypassing the normal promotion path
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ring-${{ inputs.ring }}
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.ring }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      RING: ${{ inputs.ring }}
      TARGET_REVISION: ${{ inputs.revision }}
      ROLLBACK_REASON: ${{ inputs.reason }}
      SOURCE_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Restore retained revision with read-only gates
        run: node scripts/deployment.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-${{ inputs.ring }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/deployment-state.json
          if-no-files-found: warn
          retention-days: 14
