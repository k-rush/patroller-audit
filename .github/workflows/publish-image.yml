name: Publish image
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Obtain short-lived registry credentials
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          token="$(az acr login --name "$ACR_NAME" --expose-token --query accessToken --output tsv)"
          echo "::add-mask::$token"
          printf '%s' "$token" | docker login "$ACR_LOGIN_SERVER" --username 00000000-0000-0000-0000-000000000000 --password-stdin
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/patroller-audit:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record immutable deployment digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          printf 'Image: %s/patroller-audit@%s\n' "$ACR_LOGIN_SERVER" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
