name: Deploy ring
on:
  workflow_dispatch:
    inputs:
      ring:
        description: Promote the same verified digest through test, staging, production
        type: choice
        options: [test, staging, production]
        default: test
      image_digest:
        description: sha256 digest from a successful Publish image run
        type: string
        required: true
      release_sha:
        description: Published main commit; leave blank for current main
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ring-${{ inputs.ring }}
  cancel-in-progress: false

jobs:
  resolve-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: build
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a merged main commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: ./.github/actions/resolve-image
        id: image
        with:
          release_sha: ${{ inputs.release_sha || github.sha }}
      - name: Require the published commit digest
        env:
          REQUESTED: ${{ inputs.image_digest }}
          RESOLVED: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED" == "$RESOLVED" ]]

  deploy:
    needs: resolve-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.ring }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-ring
        with:
          ring: ${{ inputs.ring }}
          image_digest: ${{ needs.resolve-image.outputs.digest }}
