name: Deploy ring
on:
  workflow_dispatch:
    inputs:
      ring:
        description: Promote the same verified digest through test, staging, production
        type: choice
        options: [test, staging, production]
        default: test
      image_digest:
        description: sha256 digest from a successful Publish image run
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.ring }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.ring }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy immutable image and check readiness
        shell: pwsh
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          RING: ${{ inputs.ring }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($key in @('RESOURCE_GROUP', 'NAME_PREFIX', 'ACR_NAME', 'FIREBASE_PROJECT_ID')) {
            if (-not [Environment]::GetEnvironmentVariable($key)) { throw "$key is required." }
          }
          if ($env:IMAGE_DIGEST -cnotmatch '^sha256:[a-f0-9]{64}$') { throw 'Invalid immutable image digest.' }
          if ($env:FIREBASE_PROJECT_ID.StartsWith('demo-')) { throw 'Cloud rings cannot use Firebase emulators.' }
          az acr repository show --name $env:ACR_NAME --image "patroller-audit@$env:IMAGE_DIGEST" --output none
          if ($LASTEXITCODE -ne 0) { throw 'Published image does not exist.' }
          $previousRing = switch ($env:RING) { 'staging' { 'test' }; 'production' { 'staging' } }
          if ($previousRing) {
            $previousImage = az containerapp show --resource-group $env:RESOURCE_GROUP --name "$env:NAME_PREFIX-$previousRing" --query 'properties.template.containers[0].image' --output tsv
            if ($LASTEXITCODE -ne 0 -or -not $previousImage.EndsWith("/patroller-audit@$env:IMAGE_DIGEST")) {
              throw 'Promotions require the same digest currently deployed in the preceding ring.'
            }
            $previousHost = az containerapp show --resource-group $env:RESOURCE_GROUP --name "$env:NAME_PREFIX-$previousRing" --query 'properties.configuration.ingress.fqdn' --output tsv
            if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve preceding ring.' }
            Invoke-WebRequest "https://$previousHost/api/health" -TimeoutSec 30 | Out-Null
          }
          $revision = "r${{ github.run_id }}-${{ github.run_attempt }}"
          $deployment = az deployment group create --resource-group $env:RESOURCE_GROUP --template-file infrastructure/app.bicep --parameters "namePrefix=$env:NAME_PREFIX" "ring=$env:RING" "imageDigest=$env:IMAGE_DIGEST" "firebaseProjectId=$env:FIREBASE_PROJECT_ID" "revisionSuffix=$revision" --output json
          if ($LASTEXITCODE -ne 0) { throw 'Application deployment failed.' }
          $url = ($deployment | ConvertFrom-Json).properties.outputs.baseUrl.value
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            try {
              Invoke-WebRequest "$url/api/health" -TimeoutSec 15 | Out-Null
              Invoke-WebRequest "$url/health" -TimeoutSec 15 | Out-Null
              "Deployed $env:RING to $url using $env:IMAGE_DIGEST" >> $env:GITHUB_STEP_SUMMARY
              return
            } catch { Start-Sleep -Seconds 5 }
          }
          throw 'Deployment did not become healthy.'
